name: Build AI Image Studio macOS Release (Apple Silicon M1-M4)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*mac*'

jobs:
  build-macos:
    name: Build & CodeSign macOS Apple Silicon (.zip)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Apple Developer Certificate to Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate from secret
          CERTIFICATE_PATH=$RUNNER_TEMP/apple_cert.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Verify identity exists
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Install Python Engine Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r python_engine/requirements.txt
          pip install pyinstaller cryptography

      - name: Freeze Python Engine with PyInstaller
        working-directory: ./python_engine
        run: |
          pyinstaller --noconfirm --clean engine.spec

      - name: Build Flutter macOS Desktop
        working-directory: ./flutter_app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release

      - name: Bundle Engine into macOS App
        run: |
          # Find the actual .app bundle built by Flutter
          APP_PATH=$(find flutter_app/build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          RESOURCES_DIR="$APP_PATH/Contents/Resources/engine"
          mkdir -p "$RESOURCES_DIR"
          cp -R python_engine/dist/engine/* "$RESOURCES_DIR/"
          chmod +x "$RESOURCES_DIR/engine"

      - name: Deep CodeSign macOS App Bundle (Developer ID Application)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application: ABDULRAHMAN NUHU INDABO ($TEAM_ID)"
          echo "Signing with identity: $IDENTITY on $APP_PATH"

          # Sign all embedded dynamic libraries and frameworks inside engine
          find "$APP_PATH/Contents/Resources/engine" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +111 \) -exec codesign --force --timestamp --options runtime --sign "$IDENTITY" {} + 2>/dev/null || true

          # Sign the main application bundle
          codesign --force --deep --timestamp --options runtime --sign "$IDENTITY" "$APP_PATH"

          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package macOS Release ZIP
        run: |
          mkdir -p dist
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          cd "$APP_DIR"
          zip -r -y "$GITHUB_WORKSPACE/dist/AI_Image_Studio_macOS_AppleSilicon.zip" "$APP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Image_Studio_macOS_AppleSilicon
          path: dist/AI_Image_Studio_macOS_AppleSilicon.zip
