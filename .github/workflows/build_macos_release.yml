name: Build AI Image Studio macOS Release (Apple Silicon M1-M4)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*mac*'

jobs:
  build-macos:
    name: Build & CodeSign macOS Apple Silicon (.zip)
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Apple Notarization History
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            KEY_PATH=$RUNNER_TEMP/AuthKey.p8
            echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"
            AUTH=(--key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          else
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID")
          fi
          echo "=== Recent Notarization History ==="
          xcrun notarytool history "${AUTH[@]}" || true
          echo "=== Previous Submission b5d2290a-48cb-4b1d-b755-d628ba7301cf ==="
          xcrun notarytool info b5d2290a-48cb-4b1d-b755-d628ba7301cf "${AUTH[@]}" || true
          xcrun notarytool log b5d2290a-48cb-4b1d-b755-d628ba7301cf "${AUTH[@]}" || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Apple Developer Certificate to Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate from secret
          CERTIFICATE_PATH=$RUNNER_TEMP/apple_cert.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Verify identity exists
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Install Python Engine Dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Same torch as the Windows build (torchvision for transformers' image processors)
          pip install torch==2.11.0 torchaudio==2.11.0 torchvision==0.26.0
          pip install -r python_engine/requirements.txt
          # chatterbox-tts pins torch 2.6 / diffusers 0.29; its imports work with the versions above
          pip install --no-deps chatterbox-tts==0.1.7
          # setuptools 81+ breaks pkg_resources, which crashes PyInstaller's pyi_rth_pkgres
          # runtime hook at launch ("module 'pkg_resources' has no attribute 'NullProvider'").
          # Same PyInstaller as the Windows build.
          pip install "setuptools<81" pyinstaller==6.22.3 cryptography

      - name: Freeze Python Engine with PyInstaller
        working-directory: ./python_engine
        run: |
          pyinstaller --noconfirm --clean engine.spec

      - name: Self-test frozen engine
        working-directory: ./python_engine
        run: |
          ./dist/engine/engine --self-test
          # Lazily imported packages the self-test does not import
          for m in torchvision; do
            find dist/engine/_internal -maxdepth 1 -name "$m*" | grep -q . || { echo "::error::$m missing from frozen engine"; exit 1; }
          done

      - name: Build Flutter macOS Desktop
        working-directory: ./flutter_app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release

      - name: Bundle Engine into macOS App
        run: |
          # Find the actual .app bundle built by Flutter
          APP_PATH=$(find flutter_app/build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          RESOURCES_DIR="$APP_PATH/Contents/Resources/engine"
          mkdir -p "$RESOURCES_DIR"
          cp -R python_engine/dist/engine/* "$RESOURCES_DIR/"
          chmod +x "$RESOURCES_DIR/engine"

      - name: Deep CodeSign macOS App Bundle (Developer ID Application)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application: ABDULRAHMAN NUHU INDABO ($TEAM_ID)"
          echo "Signing with identity: $IDENTITY on $APP_PATH"

          ENGINE_ENTITLEMENTS=flutter_app/macos/Runner/Engine.entitlements

          # Sign every Mach-O inside the engine (only real binaries, failures are fatal)
          find "$APP_PATH/Contents/Resources/engine" -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              codesign --force --timestamp --options runtime --entitlements "$ENGINE_ENTITLEMENTS" --sign "$IDENTITY" "$f"
            fi
          done

          # Sign the main application bundle
          codesign --force --deep --timestamp --options runtime --sign "$IDENTITY" "$APP_PATH"

          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          # The engine must still start under the hardened runtime after signing
          "$APP_PATH/Contents/Resources/engine/engine" --self-test

      - name: Notarize & Staple (Apple notary service)
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Without notarization Gatekeeper shows "Apple could not verify ... is free of malware",
          # even when the app is signed with a valid Developer ID certificate.
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            KEY_PATH=$RUNNER_TEMP/AuthKey.p8
            echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"
            AUTH=(--key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          elif [ -n "$APPLE_ID" ]; then
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID")
          else
            echo "::error::No notarization credentials. Set APPLE_API_KEY_P8_BASE64/APPLE_API_KEY_ID/APPLE_API_ISSUER_ID or APPLE_ID/APPLE_APP_PASSWORD."
            exit 1
          fi

          SUBMIT_ZIP=$RUNNER_TEMP/notarize.zip
          ditto -c -k --keepParent "$APP_PATH" "$SUBMIT_ZIP"
          xcrun notarytool submit "$SUBMIT_ZIP" "${AUTH[@]}" --wait --timeout 4h --output-format json 2>&1 | tee $RUNNER_TEMP/notary.json || true
          cat $RUNNER_TEMP/notary.json
          SUBMISSION_ID=$(python3 -c "import json,re; s=open('$RUNNER_TEMP/notary.json').read(); m=re.search(r'\"id\"\s*:\s*\"([^\"]+)\"', s); print(m.group(1) if m else '')")
          if [ -n "$SUBMISSION_ID" ]; then
            xcrun notarytool info "$SUBMISSION_ID" "${AUTH[@]}" --output-format json | tee $RUNNER_TEMP/notary_info.json || true
            STATUS=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary_info.json')).get('status',''))")
            xcrun notarytool log "$SUBMISSION_ID" "${AUTH[@]}" || true
          else
            STATUS="Unknown"
          fi
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status: $STATUS"
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Package macOS Release ZIP
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/dist/AI_Image_Studio_macOS_AppleSilicon.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Image_Studio_macOS_AppleSilicon
          path: dist/AI_Image_Studio_macOS_AppleSilicon.zip
