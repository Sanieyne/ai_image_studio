name: Build Windows Release (GPU + Contabo Deploy)

on:
  workflow_dispatch: # Manual trigger only from GitHub Actions UI
  push:
    tags:
      - 'v*' # Trigger only for version releases (e.g. v1.0.0)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Flutter + Python GPU Windows Bundle
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. Setup Python & Install CUDA PyTorch Dependencies
      # -------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python_engine/requirements-windows.txt'

      - name: Install Python dependencies (CUDA 12.8 torch, tested versions)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip

          # torch 2.11 built for CUDA 12.8: sm_75..sm_120 (RTX 20-series to RTX 50-series)
          pip install torch==2.11.0 torchaudio==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cu128
          if ($LASTEXITCODE -ne 0) { throw "torch install failed" }

          # Engine packages: same versions as the tested cloud lock; the constraints keep torch as installed above
          pip install -r python_engine/requirements-windows.txt -c python_engine/constraints-cloud.txt `
            --extra-index-url https://download.pytorch.org/whl/cu128
          if ($LASTEXITCODE -ne 0) { throw "engine requirements install failed" }

          # chatterbox-tts pins torch 2.6 / diffusers 0.29; its imports work with the versions above
          pip install --no-deps chatterbox-tts==0.1.7
          if ($LASTEXITCODE -ne 0) { throw "chatterbox install failed" }

      # -------------------------------------------------------------
      # 2. Build Python Engine with PyInstaller
      # -------------------------------------------------------------
      - name: Build Python Engine Executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd python_engine
          pyinstaller engine.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          cd ..

      # The built engine must import every pipeline class; a missing hidden
      # import or package fails the build here instead of on users' machines.
      - name: Engine self-test
        shell: pwsh
        run: |
          $env:AI_STUDIO_MOCK = '1'
          & python_engine\dist\engine\engine.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "engine --self-test failed (exit $LASTEXITCODE)" }

      # -------------------------------------------------------------
      # 3. Setup Flutter & Build Flutter Desktop App
      # -------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop & Create Platform Files
        shell: pwsh
        run: |
          cd flutter_app
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          flutter pub get
          cd ..

      - name: Build Flutter Windows Release
        shell: pwsh
        run: |
          cd flutter_app
          flutter build windows --release
          cd ..

      # -------------------------------------------------------------
      # 4. Assemble Unified Distribution & Sign with Trusted Certificate
      # -------------------------------------------------------------
      - name: Assemble Unified Distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\AI_Image_Studio

          # Copy Flutter Release executable and runtime DLLs
          Copy-Item -Recurse flutter_app\build\windows\x64\runner\Release\* dist\AI_Image_Studio\

          # Copy Python GPU Engine into sidecar directory
          New-Item -ItemType Directory -Force -Path dist\AI_Image_Studio\engine
          Copy-Item -Recurse python_engine\dist\engine\* dist\AI_Image_Studio\engine\

          # ---------------------------------------------------------
          # Generate Cosmic-Gen Code Signing Certificate
          # ---------------------------------------------------------
          Write-Host "Creating Cosmic-Gen trusted publisher certificate..."
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Cosmic-Gen AI Technologies, O=Cosmic-Gen AI, C=US" `
            -KeyUsage DigitalSignature `
            -KeySpec Signature `
            -FriendlyName "Cosmic-Gen AI Verified Publisher" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          # Export public cert to dist folder for 1-click customer trust
          $certPath = "dist\AI_Image_Studio\CosmicGen_Publisher.cer"
          Export-Certificate -Cert $cert -FilePath $certPath

          # Sign all executable binaries with Timestamping (SHA256)
          Write-Host "Digitally signing application executables and engine..."
          Get-ChildItem -Path "dist\AI_Image_Studio" -Filter "*.exe" -Recurse | ForEach-Object {
            Write-Host "Signing $($_.FullName)..."
            Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          }

          # Create 1-Click Trusted Launcher / Installer
          $installerScript = "@echo off`r`ntitle Installing Cosmic-Gen Trusted Publisher Certificate...`r`necho ========================================================`r`necho   Cosmic-Gen - Trusted Publisher Setup`r`necho ========================================================`r`necho.`r`necho Installing trusted publisher certificate to prevent Windows SmartScreen warnings...`r`ncertutil -addstore -f `"Root`" `"%~dp0CosmicGen_Publisher.cer`" >nul 2>&1`r`ncertutil -addstore -f `"TrustedPublisher`" `"%~dp0CosmicGen_Publisher.cer`" >nul 2>&1`r`necho.`r`necho [OK] Verified Publisher installed successfully!`r`necho Starting Cosmic-Gen...`r`nif exist `"%~dp0Cosmic-Gen.exe`" (start `"`" `"%~dp0Cosmic-Gen.exe`") else (start `"`" `"%~dp0ai_image_studio.exe`")`r`nexit`r`n"
          [System.IO.File]::WriteAllText("dist\AI_Image_Studio\1-Click_Launch.bat", $installerScript)

          # Show bundle size summary
          $size = (Get-ChildItem -Recurse dist\AI_Image_Studio | Measure-Object -Property Length -Sum).Sum
          $sizeMB = [math]::Round($size / 1MB, 1)
          Write-Host "Bundle size: $sizeMB MB"

          # Create zip archive
          Compress-Archive -Path dist\AI_Image_Studio\* -DestinationPath dist\AI_Image_Studio_Windows_x64_GPU.zip

          # Show zip size
          $zipSize = (Get-Item dist\AI_Image_Studio_Windows_x64_GPU.zip).Length
          $zipSizeMB = [math]::Round($zipSize / 1MB, 1)
          Write-Host "Zip size: $zipSizeMB MB"

      # Artifact handoff: deploy job downloads this (lets deploy retry
      # in minutes via re-run instead of another full 20-min rebuild).
      - name: Upload GPU bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-zip
          path: dist/AI_Image_Studio_Windows_x64_GPU.zip
          retention-days: 3

  deploy:
    name: Deploy GPU Bundle to Contabo
    runs-on: windows-latest
    needs: build-windows
    # Only version tags publish; manual runs just build and test.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Download GPU bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: gpu-zip
          path: dist

      # -------------------------------------------------------------
      # 5. Fast Cloudflare R2 Parallel Upload & Contabo High-Speed Sync
      # -------------------------------------------------------------
      - name: Deploy build to Contabo VPS (via High-Speed R2 Pipeline)
        shell: pwsh
        env:
          CONTABO_SSH_KEY_B64: ${{ secrets.CONTABO_SSH_KEY_B64 }}
          CONTABO_IP: ${{ secrets.CONTABO_IP }}
          CONTABO_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = "$HOME\.ssh\contabo_key"
          New-Item -ItemType Directory -Force -Path (Split-Path $keyPath) | Out-Null
          $keyBytes = [Convert]::FromBase64String($env:CONTABO_SSH_KEY_B64.Trim())
          Write-Host "decoded key bytes: $($keyBytes.Length) (expect 411)"
          if ($keyBytes.Length -lt 100) { throw "decoded key too short - secret is damaged" }
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):R" | Out-Null

          $knownHostsPath = "$HOME\.ssh\contabo_known_hosts"
          [System.IO.File]::WriteAllText($knownHostsPath, $env:CONTABO_KNOWN_HOSTS.Trim() + "`n")

          $ssh = 'C:\Windows\System32\OpenSSH\ssh.exe'
          $sshOpts = @('-i', $keyPath, '-o', "UserKnownHostsFile=$knownHostsPath", '-o', 'StrictHostKeyChecking=yes', '-o', 'ConnectTimeout=30')

          # 1. Fast parallel multi-part upload to Cloudflare R2 with adaptive retry
          Write-Host "Uploading 3.16 GB Windows release to Cloudflare R2..."
          python -m pip install --quiet boto3
          $r2Success = $false
          try {
            python -c @"
          import os, boto3
          from botocore.config import Config
          from boto3.s3.transfer import TransferConfig

          endpoint = os.environ.get('R2_ENDPOINT')
          key_id = os.environ.get('R2_ACCESS_KEY_ID')
          secret = os.environ.get('R2_SECRET_ACCESS_KEY')
          bucket = os.environ.get('R2_BUCKET_NAME', 'cosmic-gen')

          client_config = Config(retries={'max_attempts': 10, 'mode': 'adaptive'}, connect_timeout=60, read_timeout=60)
          s3 = boto3.client('s3', endpoint_url=endpoint, aws_access_key_id=key_id, aws_secret_access_key=secret, region_name='auto', config=client_config)
          config = TransferConfig(multipart_threshold=50*1024*1024, max_concurrency=4, multipart_chunksize=50*1024*1024, use_threads=True)

          file_path = 'dist/AI_Image_Studio_Windows_x64_GPU.zip'
          s3.upload_file(file_path, bucket, 'releases/AI_Image_Studio_Windows_x64_GPU.zip', Config=config)
          print('Cloudflare R2 multi-part upload complete!')
          "@
            $r2Success = $true
          } catch {
            Write-Warning "Cloudflare R2 upload encountered an error: $_. Falling back to direct SCP."
          }

          if ($r2Success) {
            # 2. Contabo pulls directly from R2 at full 185+ Mbps line speed (~1.5 minutes)
            Write-Host "Signaling Contabo VPS to pull release from Cloudflare R2..."
            $remoteCmd = "python3 -c `"import boto3; from boto3.s3.transfer import TransferConfig; s3 = boto3.client('s3', endpoint_url='$($env:R2_ENDPOINT)', aws_access_key_id='$($env:R2_ACCESS_KEY_ID)', aws_secret_access_key='$($env:R2_SECRET_ACCESS_KEY)', region_name='auto'); config = TransferConfig(multipart_threshold=50*1024*1024, max_concurrency=4, multipart_chunksize=50*1024*1024, use_threads=True); s3.download_file('$($env:R2_BUCKET_NAME)', 'releases/AI_Image_Studio_Windows_x64_GPU.zip', '/var/www/releases/ai_image_studio/AI_Image_Studio_Windows_x64_GPU.zip', Config=config)`" && cd /var/www/releases/ai_image_studio && ln -sf AI_Image_Studio_Windows_x64_GPU.zip latest_release.zip && ln -sf AI_Image_Studio_Windows_x64_GPU.zip Cosmic-Gen_Windows_latest.zip && ln -sf AI_Image_Studio_Windows_x64_GPU.zip Cosmic-Gen_Windows_x64_GPU.zip && echo Deploy complete: `$(date)"
            & $ssh @sshOpts "root@$($env:CONTABO_IP)" $remoteCmd
            if ($LASTEXITCODE -ne 0) { throw "Contabo high-speed pull failed (exit $LASTEXITCODE)" }
          } else {
            # Direct SCP fallback
            Write-Host "Executing fallback SCP upload directly to Contabo..."
            $scp = 'C:\Windows\System32\OpenSSH\scp.exe'
            & $scp @sshOpts 'dist\AI_Image_Studio_Windows_x64_GPU.zip' "root@$($env:CONTABO_IP):/var/www/releases/ai_image_studio/"
            & $ssh @sshOpts "root@$($env:CONTABO_IP)" 'cd /var/www/releases/ai_image_studio && ln -sf AI_Image_Studio_Windows_x64_GPU.zip latest_release.zip && ln -sf AI_Image_Studio_Windows_x64_GPU.zip Cosmic-Gen_Windows_latest.zip && ln -sf AI_Image_Studio_Windows_x64_GPU.zip Cosmic-Gen_Windows_x64_GPU.zip'
          }

      # -------------------------------------------------------------
      # 6. Create GitHub Release on Tag (no artifact - build is on Contabo)
      # -------------------------------------------------------------
      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## AI Image Studio - Windows x64 (GPU Build)

            **Download**: Available on the Contabo release server.

            ### System Requirements
            - Windows 10/11 64-bit
            - NVIDIA GPU with CUDA 12.1+ (RTX 20xx or newer)
            - Minimum 8 GB VRAM recommended
            - 16 GB RAM

            ### What's included
            - Flutter desktop app
            - Python AI engine (PyInstaller, CUDA 12.1, PyTorch)
            - All AI models downloaded on first use
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
