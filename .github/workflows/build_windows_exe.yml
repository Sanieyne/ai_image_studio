name: Build Windows Release (GPU + Contabo Deploy)

on:
  workflow_dispatch: # Manual trigger only from GitHub Actions UI
  push:
    tags:
      - 'v*' # Trigger only for version releases (e.g. v1.0.0)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Flutter + Python GPU Windows Bundle
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. Setup Python & Install CUDA PyTorch Dependencies
      # -------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python_engine/requirements-windows.txt'

      - name: Install Python dependencies (CUDA 12.8 torch, tested versions)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip

          # torch 2.11 built for CUDA 12.8: sm_75..sm_120 (RTX 20-series to RTX 50-series)
          pip install torch==2.11.0 torchaudio==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cu128
          if ($LASTEXITCODE -ne 0) { throw "torch install failed" }

          # Engine packages: same versions as the tested cloud lock; the constraints keep torch as installed above
          pip install -r python_engine/requirements-windows.txt -c python_engine/constraints-cloud.txt `
            --extra-index-url https://download.pytorch.org/whl/cu128
          if ($LASTEXITCODE -ne 0) { throw "engine requirements install failed" }

          # chatterbox-tts pins torch 2.6 / diffusers 0.29; its imports work with the versions above
          pip install --no-deps chatterbox-tts==0.1.7
          if ($LASTEXITCODE -ne 0) { throw "chatterbox install failed" }

      # -------------------------------------------------------------
      # 2. Build Python Engine with PyInstaller
      # -------------------------------------------------------------
      - name: Build Python Engine Executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd python_engine
          pyinstaller engine.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          cd ..

      # The built engine must import every pipeline class; a missing hidden
      # import or package fails the build here instead of on users' machines.
      - name: Engine self-test
        shell: pwsh
        run: |
          $env:AI_STUDIO_MOCK = '1'
          & python_engine\dist\engine\engine.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "engine --self-test failed (exit $LASTEXITCODE)" }

      # -------------------------------------------------------------
      # 3. Setup Flutter & Build Flutter Desktop App
      # -------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop & Create Platform Files
        shell: pwsh
        run: |
          cd flutter_app
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          flutter pub get
          cd ..

      - name: Build Flutter Windows Release
        shell: pwsh
        run: |
          cd flutter_app
          flutter build windows --release
          cd ..

      # -------------------------------------------------------------
      # 4. Assemble Unified Distribution & Sign with Trusted Certificate
      # -------------------------------------------------------------
      - name: Assemble Unified Distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\AI_Image_Studio

          # Copy Flutter Release executable and runtime DLLs
          Copy-Item -Recurse flutter_app\build\windows\x64\runner\Release\* dist\AI_Image_Studio\

          # Copy Python GPU Engine into sidecar directory
          New-Item -ItemType Directory -Force -Path dist\AI_Image_Studio\engine
          Copy-Item -Recurse python_engine\dist\engine\* dist\AI_Image_Studio\engine\

          # ---------------------------------------------------------
          # Generate Cosmic-Gen Code Signing Certificate
          # ---------------------------------------------------------
          Write-Host "Creating Cosmic-Gen trusted publisher certificate..."
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Cosmic-Gen AI Technologies, O=Cosmic-Gen AI, C=US" `
            -KeyUsage DigitalSignature `
            -KeySpec Signature `
            -FriendlyName "Cosmic-Gen AI Verified Publisher" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          # Sign all executable binaries with Timestamping (SHA256)
          Write-Host "Digitally signing application executables and engine..."
          Set-AuthenticodeSignature -FilePath "dist\AI_Image_Studio\ai_image_studio.exe" -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          Set-AuthenticodeSignature -FilePath "dist\AI_Image_Studio\engine\engine.exe" -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"

          # Show bundle size summary
          $size = (Get-ChildItem -Recurse dist\AI_Image_Studio | Measure-Object -Property Length -Sum).Sum
          $sizeMB = [math]::Round($size / 1MB, 1)
          Write-Host "Bundle size: $sizeMB MB"

          # Keep the cert for signing the installer in the next step
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # One installer instead of a folder of ~10k files: Start menu + desktop
      # shortcut, uninstaller in Settings > Apps. Split into Setup.exe + .bin
      # parts (the bundle is bigger than one .exe can hold), shipped as one zip.
      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }

          $version = ((Select-String -Path flutter_app\pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          Write-Host "Installer version: $version"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\AI_Image_Studio" installer\windows\ai_image_studio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }

          $cert = Get-Item "Cert:\CurrentUser\My\$env:CERT_THUMBPRINT"
          Set-AuthenticodeSignature -FilePath dist\installer\AI_Image_Studio_Setup.exe -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"

          Get-ChildItem dist\installer | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

          # Store only: the .bin parts are already LZMA-compressed.
          # Use 7z instead of Compress-Archive because Compress-Archive fails with
          # "Stream was too long" on single files > 2 GB (AI_Image_Studio_Setup-1.bin is ~2.8 GB).
          7z a -tzip -mx=0 dist\AI_Image_Studio_Windows_Setup.zip .\dist\installer\*
          if ($LASTEXITCODE -ne 0) { throw "7z archive creation failed (exit $LASTEXITCODE)" }
          $zipSizeMB = [math]::Round((Get-Item dist\AI_Image_Studio_Windows_Setup.zip).Length / 1MB, 1)
          Write-Host "Installer zip size: $zipSizeMB MB"

      # Artifact handoff: deploy job downloads this (lets deploy retry
      # in minutes via re-run instead of another full 20-min rebuild).
      - name: Upload GPU bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-zip
          path: dist/AI_Image_Studio_Windows_Setup.zip
          retention-days: 3

  deploy:
    name: Deploy GPU Bundle to Contabo
    runs-on: windows-latest
    needs: build-windows
    # Only version tags publish; manual runs just build and test.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Download GPU bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: gpu-zip
          path: dist

      - name: Deploy build to Contabo VPS
        shell: pwsh
        env:
          CONTABO_SSH_KEY_B64: ${{ secrets.CONTABO_SSH_KEY_B64 }}
          CONTABO_IP: ${{ secrets.CONTABO_IP }}
          CONTABO_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = "$HOME\.ssh\contabo_key"
          New-Item -ItemType Directory -Force -Path (Split-Path $keyPath) | Out-Null
          # Key stored as single-line base64: multiline secret values
          # get mangled between GitHub and the runner file write.
          $keyBytes = [Convert]::FromBase64String($env:CONTABO_SSH_KEY_B64.Trim())
          Write-Host "decoded key bytes: $($keyBytes.Length) (expect 411)"
          if ($keyBytes.Length -lt 100) { throw "decoded key too short - secret is damaged" }
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):R" | Out-Null

          # Fail fast on a bad key. Prints only the PUBLIC key (safe to log).
          $keygen = 'C:\Windows\System32\OpenSSH\ssh-keygen.exe'
          $pubKey = & $keygen -y -f $keyPath
          if ($LASTEXITCODE -ne 0) { throw "deploy key does not parse" }
          Write-Host "deploy key OK"

          # Pin the server's host key: only the key in the CONTABO_KNOWN_HOSTS
          # secret (output of `ssh-keyscan <host>`, checked by hand) is trusted.
          if ([string]::IsNullOrWhiteSpace($env:CONTABO_KNOWN_HOSTS)) { throw "CONTABO_KNOWN_HOSTS secret is not set" }
          $knownHostsPath = "$HOME\.ssh\contabo_known_hosts"
          [System.IO.File]::WriteAllText($knownHostsPath, $env:CONTABO_KNOWN_HOSTS.Trim() + "`n")

          $ssh = 'C:\Windows\System32\OpenSSH\ssh.exe'
          $scp = 'C:\Windows\System32\OpenSSH\scp.exe'
          $sshOpts = @('-i', $keyPath, '-o', "UserKnownHostsFile=$knownHostsPath", '-o', 'StrictHostKeyChecking=yes', '-o', 'ConnectTimeout=30')

          & $scp @sshOpts 'dist\AI_Image_Studio_Windows_Setup.zip' "root@$($env:CONTABO_IP):/var/www/releases/ai_image_studio/"
          if ($LASTEXITCODE -ne 0) { throw "scp upload failed (exit $LASTEXITCODE)" }

          & $ssh @sshOpts "root@$($env:CONTABO_IP)" 'cd /var/www/releases/ai_image_studio && ln -sf AI_Image_Studio_Windows_Setup.zip latest_release.zip && ls -lah && echo Deploy complete: $(date)'
          if ($LASTEXITCODE -ne 0) { throw "remote symlink update failed (exit $LASTEXITCODE)" }

      # -------------------------------------------------------------
      # 6. Create GitHub Release on Tag (no artifact - build is on Contabo)
      # -------------------------------------------------------------
      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## AI Image Studio - Windows x64 (GPU Build)

            **Download**: Available on the Contabo release server.

            ### System Requirements
            - Windows 10/11 64-bit
            - NVIDIA GPU with CUDA 12.1+ (RTX 20xx or newer)
            - Minimum 8 GB VRAM recommended
            - 16 GB RAM

            ### What's included
            - Flutter desktop app
            - Python AI engine (PyInstaller, CUDA 12.1, PyTorch)
            - All AI models downloaded on first use
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
