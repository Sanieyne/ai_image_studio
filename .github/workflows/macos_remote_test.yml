name: macOS Remote Test Runner (Apple Silicon + Tailscale + VNC)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duration to keep the Mac runner alive (minutes)'
        required: true
        default: '120'
        type: string
      vnc_password:
        description: 'VNC Password for Screen Sharing'
        required: true
        default: 'cosmic123'
        type: string
      open_app:
        description: 'Automatically download and launch Cosmic-Gen.app'
        required: true
        default: true
        type: boolean

jobs:
  macos-runner:
    name: Apple Silicon macOS Runner
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: macos-test-runner
          args: --ssh

      - name: Configure Screen Sharing (VNC) & User Access
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          echo "=== [1/4] Setting runner user password ==="
          sudo dscl . -passwd /Users/runner "$VNC_PASSWORD"

          echo "=== [2/4] Enabling Screen Sharing service ==="
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

          echo "=== [3/4] Configuring Apple Remote Desktop kickstart ==="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent

          echo "=== [4/4] Getting Tailscale IP address ==="
          TS_IP=$(tailscale ip -4)
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV
          
          echo "=========================================================="
          echo " macOS Apple Silicon Runner is Online!"
          echo " Tailscale IP: $TS_IP"
          echo " VNC URL:      vnc://$TS_IP:5900"
          echo " VNC User:     runner"
          echo " VNC Password: $VNC_PASSWORD"
          echo " SSH:          ssh runner@$TS_IP"
          echo "=========================================================="

      - name: Download & Launch Cosmic-Gen.app
        if: ${{ inputs.open_app }}
        run: |
          echo "=== Downloading latest Cosmic-Gen macOS build ==="
          curl -fSL -o /tmp/Cosmic-Gen.zip https://cosmic-gen.com/releases/ai_image_studio/Cosmic-Gen_macOS_AppleSilicon.zip
          
          echo "=== Unzipping to /Applications ==="
          unzip -q -o /tmp/Cosmic-Gen.zip -d /Applications/
          
          APP_PATH=$(find /Applications -maxdepth 2 -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            xattr -cr "$APP_PATH" || true
            open "$APP_PATH" || true
            echo "Cosmic-Gen.app launched!"
          else
            echo "Warning: .app bundle not found in /Applications"
          fi

      - name: Keep Runner Session Alive
        env:
          DURATION: ${{ inputs.duration_minutes }}
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          echo "=== Interactive Remote Session Started ==="
          echo "Remaining alive for $DURATION minutes..."
          echo "Connect from your PC/Mac via VNC to: vnc://${{ env.TS_IP }}:5900"
          echo "Tailscale SSH access: ssh runner@${{ env.TS_IP }}"
          
          TOTAL_SECS=$(( DURATION * 60 ))
          INTERVAL=30
          ELAPSED=0
          
          while [ $ELAPSED -lt $TOTAL_SECS ]; do
            sleep $INTERVAL
            ELAPSED=$(( ELAPSED + INTERVAL ))
            REMAINING=$(( (TOTAL_SECS - ELAPSED) / 60 ))
            if [ $(( ELAPSED % 300 )) -eq 0 ]; then
              echo "[$(date '+%H:%M:%S')] Apple Silicon Runner Active (${{ env.TS_IP }}) - $REMAINING mins remaining"
            fi
          done
          echo "Session duration elapsed. Shutting down runner."
